<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CertiShield</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07101f;
        color: #eef6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(99, 226, 255, 0.16), transparent 22%),
          radial-gradient(circle at bottom left, rgba(126, 92, 255, 0.18), transparent 18%),
          linear-gradient(180deg, #040814 0%, #091522 100%);
      }
      .page {
        width: min(100%, 740px);
        padding: 32px;
        border-radius: 32px;
        background: rgba(9, 18, 36, 0.78);
        box-shadow: 0 30px 90px rgba(1, 7, 21, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        animation: fadeIn 0.9s ease-out;
      }
      .hero {
        display: grid;
        gap: 18px;
        margin-bottom: 28px;
      }
      .hero-title {
        font-size: clamp(2.4rem, 3.8vw, 3.5rem);
        margin: 0;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      .hero-subtitle {
        margin: 0;
        max-width: 34rem;
        color: #c9d7f5;
        opacity: 0.9;
        font-size: 1rem;
        line-height: 1.8;
      }
      form {
        display: grid;
        gap: 16px;
        animation: slideUp 0.9s ease-out 0.1s both;
      }
      .input-wrap {
        display: grid;
        gap: 12px;
      }
      label {
        font-size: 0.95rem;
        color: #9bb2d6;
      }
      input[type="file"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #eef6ff;
        outline: none;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      input[type="file"]:hover,
      input[type="file"]:focus {
        border-color: rgba(99, 226, 255, 0.5);
        box-shadow: 0 0 0 4px rgba(99, 226, 255, 0.08);
      }
      button {
        max-width: 180px;
        align-self: start;
        border: none;
        border-radius: 18px;
        padding: 16px 22px;
        color: #0d1b39;
        font-weight: 700;
        background: linear-gradient(135deg, #5db9ff 0%, #8c60ff 100%);
        box-shadow: 0 16px 35px rgba(92, 166, 255, 0.24);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 40px rgba(92, 166, 255, 0.32);
      }
      button:active {
        transform: translateY(0);
      }
      .result-panel {
        margin-top: 28px;
        padding: 26px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        animation: popIn 0.6s ease-out;
      }
      .result-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(255, 113, 113, 0.14);
        color: #ffd5cc;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .score {
        margin: 0;
        color: #cde7ff;
        font-size: 1.1rem;
      }
      .threats {
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }
      .threats li {
        position: relative;
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        color: #dee8ff;
        font-size: 0.98rem;
        animation: fadeInUp 0.45s ease both;
      }
      .threats li::before {
        content: "•";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #7cc3ff;
      }
      .threats li:nth-child(1) {
        animation-delay: 0.12s;
      }
      .threats li:nth-child(2) {
        animation-delay: 0.18s;
      }
      .threats li:nth-child(3) {
        animation-delay: 0.24s;
      }
      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at top left, rgba(93, 185, 255, 0.18), transparent 18%),
          radial-gradient(circle at bottom right, rgba(155, 85, 255, 0.20), transparent 22%);
        filter: blur(18px);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="glow"></div>
      <section class="hero">
        <div>
          <h1 class="hero-title">CertiShield</h1>
          <p class="hero-subtitle">Scan document files instantly and get a polished threat summary powered by CertiShield's security check.</p>
        </div>
      </section>
      <form method="post" enctype="multipart/form-data">
        <div class="input-wrap">
          <label for="scan-file">Choose a file to scan</label>
          <input type="file" name="file" id="scan-file" />
        </div>
        <button type="submit">Scan</button>
      </form>
      {% if result %}
      <section class="result-panel">
        <div class="result-header">
          <span class="status-badge">Status: {{ result.status }}</span>
          <p class="score">Score {{ result.score }}</p>
        </div>
        <ul class="threats">
          {% for t in result.threats %}
          <li>{{ t }}</li>
          {% endfor %}
        </ul>
      </section>
      {% endif %}
    </div>
  </body>
</html>
